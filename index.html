<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Flight Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #050505; overflow: hidden; font-family: Roboto, Arial, sans-serif; }
  #led { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .btn { position: fixed; bottom: 10px; right: 10px; width: 44px; height: 44px; border-radius: 22px; border: 1px solid #333;
         background: rgba(20,20,20,.7); color: #888; font-size: 22px; line-height: 42px; text-align: center; cursor: pointer; z-index: 5; }
  #fbtn { right: 64px; display: flex; align-items: center; justify-content: center; line-height: 1; }
  #fbtn.on { border-color: #ffb000; color: #ffb000; }
  #fpanel { position: fixed; inset: 0; background: rgba(0,0,0,.94); z-index: 10; display: none; overflow: auto; }
  #fpanel .box { max-width: 560px; margin: 0 auto; padding: 24px 20px 40px; color: #ddd; }
  #fpanel h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; color: #fff; }
  #fpanel h2 { font-size: 13px; margin: 22px 0 8px; color: #9a9a9a; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  #fcount { font-size: 13px; color: #8a8a8a; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 12px 12px; border: 1px solid #2c2c2c; border-radius: 8px; margin: 0 0 6px; font-size: 16px; cursor: pointer; background: #111; color: #eee; }
  .opt input { width: 22px; height: 22px; flex: none; }
  .opt .n { margin-left: auto; color: #8a8a8a; font-size: 14px; white-space: nowrap; }
  .opt.gone { opacity: .55; }
  .none { color: #777; font-size: 14px; padding: 6px 2px; }
  #panel { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 10; display: none; overflow: auto; }
  #panel .box { max-width: 460px; margin: 0 auto; padding: 24px 20px 40px; color: #ddd; }
  #panel h1 { font-size: 20px; margin: 0 0 16px; font-weight: 600; color: #fff; }
  label { display: block; margin: 14px 0 4px; font-size: 13px; color: #9a9a9a; }
  input[type=text], input[type=number], select { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; background: #151515; color: #fff; border: 1px solid #3a3a3a; border-radius: 6px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; min-width: 0; }
  .check { display: flex; align-items: center; gap: 10px; margin: 16px 0 0; color: #ddd; font-size: 15px; }
  .check input { width: 20px; height: 20px; }
  .actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  button.main, button.alt { padding: 12px 18px; font-size: 16px; border-radius: 6px; border: 1px solid #444; cursor: pointer; }
  button.main { background: #ffb000; color: #000; border-color: #ffb000; font-weight: 600; }
  button.alt { background: #1a1a1a; color: #ddd; }
  #msg { margin-top: 14px; font-size: 13px; color: #8aa; min-height: 18px; }
</style>
</head>
<body>
<canvas id="led"></canvas>
<div class="btn" id="fbtn" title="Filter flights"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/></svg></div>
<div class="btn" id="gear" title="Settings">&#9881;</div>

<div id="fpanel">
  <div class="box">
    <h1>Filter flights</h1>
    <div id="fcount"></div>
    <h2>Airlines</h2>
    <div id="fair"></div>
    <h2>Aircraft</h2>
    <div id="ftype"></div>
    <div class="actions">
      <button class="main" id="fclose">Done</button>
      <button class="alt" id="fclear">Show everything</button>
    </div>
  </div>
</div>

<div id="panel">
  <div class="box">
    <h1>Flight Board settings</h1>
    <div class="row">
      <div><label for="lat">Latitude</label><input type="text" id="lat" inputmode="decimal"></div>
      <div><label for="lon">Longitude</label><input type="text" id="lon" inputmode="decimal"></div>
    </div>
    <div class="actions" style="margin-top:10px"><button class="alt" id="geo">Use this device's location</button></div>
    <label for="km">Radius (km, max 460)</label>
    <input type="number" id="km" min="1" max="460">
    <label for="proxy">Relay address (required: flight data and airline logos come through it)</label>
    <input type="text" id="proxy" placeholder="https://something.workers.dev">
    <div class="row">
      <div><label for="minAlt">Min altitude (ft)</label><input type="number" id="minAlt"></div>
      <div><label for="maxAlt">Max altitude (ft)</label><input type="number" id="maxAlt"></div>
    </div>
    <div class="check"><input type="checkbox" id="ground"><span>Hide aircraft on the ground</span></div>
    <div class="check"><input type="checkbox" id="demo"><span>Demo mode (fake flight, no internet needed)</span></div>
    <div class="actions">
      <button class="main" id="save">Save</button>
      <button class="alt" id="full">Full screen</button>
      <button class="alt" id="close">Close</button>
    </div>
    <div id="msg"></div>
    <div style="margin-top:18px;font-size:12px;color:#666">Version 14</div>
  </div>
</div>

<script>
(function () {
  var DEFAULTS = { v: 3, lat: 51.5, lon: -0.12, km: 25, minAlt: 0, maxAlt: 60000, ground: true, demo: false, proxy: '', fAir: [], fType: [] };
  // ICAO callsign prefix -> [name, IATA code]
  var AIRLINES = {
    BAW: ['British Airways', 'BA'], EZY: ['easyJet', 'U2'], EJU: ['easyJet Europe', 'EC'], EZS: ['easyJet Swiss', 'DS'],
    RYR: ['Ryanair', 'FR'], VIR: ['Virgin Atlantic', 'VS'], UAE: ['Emirates', 'EK'], DLH: ['Lufthansa', 'LH'],
    AFR: ['Air France', 'AF'], KLM: ['KLM', 'KL'], IBE: ['Iberia', 'IB'], SAS: ['Scandinavian', 'SK'],
    TAP: ['TAP Portugal', 'TP'], AAL: ['American', 'AA'], DAL: ['Delta', 'DL'], UAL: ['United', 'UA'],
    ACA: ['Air Canada', 'AC'], QTR: ['Qatar Airways', 'QR'], ETD: ['Etihad', 'EY'], SIA: ['Singapore Air', 'SQ'],
    CPA: ['Cathay Pacific', 'CX'], QFA: ['Qantas', 'QF'], THY: ['Turkish', 'TK'], TUI: ['TUI', 'BY'],
    TOM: ['TUI', 'BY'], WZZ: ['Wizz Air', 'W6'], EIN: ['Aer Lingus', 'EI'], SWR: ['Swiss', 'LX'],
    AUA: ['Austrian', 'OS'], FIN: ['Finnair', 'AY'], LOT: ['LOT Polish', 'LO'], JBU: ['JetBlue', 'B6'],
    ANA: ['All Nippon', 'NH'], JAL: ['Japan Airlines', 'JL'], ELY: ['El Al', 'LY'], VLG: ['Vueling', 'VY'],
    NSZ: ['Norwegian', 'DY'], NAX: ['Norwegian', 'DY'], NOZ: ['Norwegian', 'DY'], LOG: ['Loganair', 'LM'],
    EXS: ['Jet2', 'LS'], FDX: ['FedEx', 'FX'], UPS: ['UPS', '5X'], CFE: ['BA CityFlyer', 'BA'],
    SHT: ['BA Shuttle', 'BA'], SVA: ['Saudia', 'SV'], BEL: ['Brussels Air', 'SN'], AIC: ['Air India', 'AI'],
    ETH: ['Ethiopian', 'ET'], MSR: ['EgyptAir', 'MS'], CSN: ['China Southern', 'CZ'], CCA: ['Air China', 'CA'],
    KAL: ['Korean Air', 'KE'], AZA: ['ITA Airways', 'AZ'], ITY: ['ITA Airways', 'AZ'], PGT: ['Pegasus', 'PC'],
    RRR: ['Royal Air Force', '']
  };

  var S = load();
  var flights = [], inRadius = [], routes = {}, status = '', lastErr = '', logoImgs = {};
  var diag = { route: '', logo: '' };   // shown in the settings panel to help find problems
  var canvas = document.getElementById('led'), ctx = canvas.getContext('2d');
  var $ = function (id) { return document.getElementById(id); };

  function load() {
    var s = {}, k, saved = null;
    try { saved = JSON.parse(localStorage.getItem('flightboard') || 'null'); } catch (e) {}
    for (k in DEFAULTS) s[k] = (saved && saved[k] !== undefined) ? saved[k] : DEFAULTS[k];
    return s;
  }
  function save() { try { localStorage.setItem('flightboard', JSON.stringify(S)); } catch (e) {} }
  function base() { return S.proxy ? S.proxy.replace(/\/+$/, '') : ''; }

  /* ---------- logos ---------- */
  function getLogo(iata) {
    if (logoImgs[iata] !== undefined) return;
    if (!base()) { logoImgs[iata] = false; diag.logo = 'Logo: add the relay address in settings to get logos'; return; }
    logoImgs[iata] = 'loading';
    var im = new Image();
    im.onload = function () { logoImgs[iata] = im; diag.logo = 'Logo ' + iata + ': loaded'; redraw(); };
    im.onerror = function () { logoImgs[iata] = false; diag.logo = 'Logo ' + iata + ': not found. Update the relay (relay-worker.js) and check its address.'; redraw(); };
    im.src = base() + '/logo?code=' + encodeURIComponent(iata);
  }

  /* ---------- helpers ---------- */
  function clean(str) {
    str = String(str == null ? '' : str);
    try { str = str.normalize('NFD').replace(/[̀-ͯ]/g, ''); } catch (e) {}
    return str.replace(/[^A-Za-z0-9 .\-'>\/:,]/g, '').replace(/\s+/g, ' ').replace(/^ | $/g, '');
  }
  function tidy(name) {
    return clean(String(name || '').replace(/International/gi, 'Intl').replace(/Airport/gi, ''));
  }
  function hav(a, b, c, d) {
    var R = 6371, t = Math.PI / 180;
    var dl = (c - a) * t, dn = (d - b) * t;
    var x = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(a * t) * Math.cos(c * t) * Math.sin(dn / 2) * Math.sin(dn / 2);
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
  }

  /* ---------- departures board ---------- */
  var COLS = 26, ROWS = 6, LOGOC = 4, MAPC = 6;
  var TEXTC0 = LOGOC, TEXTC1 = COLS - MAPC;
  // tile groups: [row, first column, last column]. Gaps between groups have no tiles.
  var SEGS = [[0, 4, 19], [1, 4, 19], [2, 4, 19], [3, 0, 2], [3, 4, 25], [4, 0, 2], [4, 4, 25], [5, 0, 11], [5, 13, 22]];
  var cellOn = new Uint8Array(COLS * ROWS);
  (function () { var k, c; for (k = 0; k < SEGS.length; k++) for (c = SEGS[k][1]; c <= SEGS[k][2]; c++) cellOn[SEGS[k][0] * COLS + c] = 1; })();
  var SEQ = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-/>:,'?";
  var NSEQ = SEQ.length, STEP = 55;                      // ms per flap
  var cellCur = new Uint8Array(COLS * ROWS), cellTgt = new Uint8Array(COLS * ROWS), cellStart = new Float64Array(COLS * ROWS);
  var sprites = [], spriteKey = '', rafId = 0, lastFrame = 0, flapBusy = false;
  var board = { iata: '', rt: null };
  var tileCache = {}, tileCount = 0, trail = [], trailKey = '', fix = null;
  var FLAPFONT = '"Roboto Condensed","Arial Narrow",Arial,sans-serif';
  (function () { for (var q = 0; q < cellStart.length; q++) cellStart[q] = -1; })();

  function rr(x, X, Y, w, h, r) {
    x.beginPath(); x.moveTo(X + r, Y); x.lineTo(X + w - r, Y); x.quadraticCurveTo(X + w, Y, X + w, Y + r);
    x.lineTo(X + w, Y + h - r); x.quadraticCurveTo(X + w, Y + h, X + w - r, Y + h); x.lineTo(X + r, Y + h);
    x.quadraticCurveTo(X, Y + h, X, Y + h - r); x.lineTo(X, Y + r); x.quadraticCurveTo(X, Y, X + r, Y); x.closePath();
  }

  function flapGeo() {
    var cw = window.innerWidth, ch = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    var m = Math.round(Math.min(cw, ch) * 0.045);                 // screen margin, includes the board frame
    var w = Math.floor((cw - 2 * m) / COLS);
    var hAvail = (ch - 2 * m - 14) / (ROWS + 0.7), h;
    if (hAvail < w / 0.8) { h = Math.floor(hAvail); w = Math.floor(h * 0.8); }   // very wide screen: limit by height
    else h = Math.floor(Math.min(hAvail, w / 0.44));                              // otherwise stretch tiles to the full height
    var cap = Math.round(h * 0.3), bh = h * ROWS + 2 * cap + 14;
    return { cw: cw, ch: ch, dpr: dpr, w: w, h: h, cap: cap, bx: Math.round((cw - w * COLS) / 2), by: Math.round((ch - bh) / 2), bh: bh };
  }
  function rowY(g, r) { return g.by + (r < 3 ? g.cap + r * g.h : 2 * g.cap + r * g.h); }

  function drawTile(x, w, h, ch, fs) {
    var pad = Math.max(1, Math.round(w * 0.03)), gr = x.createLinearGradient(0, 0, 0, h), rad = Math.max(2, w * 0.07);
    x.fillStyle = '#0b0b0b'; x.fillRect(0, 0, w, h);
    gr.addColorStop(0, '#3b3b3d'); gr.addColorStop(0.495, '#2c2c2e'); gr.addColorStop(0.505, '#232325'); gr.addColorStop(1, '#1b1b1c');
    rr(x, pad, pad, w - 2 * pad, h - 2 * pad, rad); x.fillStyle = gr; x.fill();
    x.strokeStyle = 'rgba(255,255,255,0.10)'; x.lineWidth = 1; rr(x, pad + 0.5, pad + 0.5, w - 2 * pad - 1, h - 2 * pad - 1, rad); x.stroke();
    if (ch !== ' ') {
      x.fillStyle = '#ebebeb'; x.font = '600 ' + fs + 'px ' + FLAPFONT; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(ch, w / 2, h / 2 + fs * 0.05);
    }
    x.fillStyle = '#080808'; x.fillRect(pad, h / 2 - 1.5, w - 2 * pad, 3);               // hinge gap
    x.fillStyle = 'rgba(255,255,255,0.12)'; x.fillRect(pad, h / 2 + 1.5, w - 2 * pad, 1);
    x.fillStyle = '#050505';                                                              // hinge pins
    x.beginPath(); x.arc(pad + 1.5, h / 2, Math.max(1.5, w * 0.03), 0, 6.2832); x.arc(w - pad - 1.5, h / 2, Math.max(1.5, w * 0.03), 0, 6.2832); x.fill();
  }
  function buildSprites(g) {
    var i, c, x, fs = Math.round(Math.min(g.h * 0.68, g.w * 1.08));
    sprites = [];
    for (i = 0; i < NSEQ; i++) {
      c = document.createElement('canvas'); c.width = Math.round(g.w * g.dpr); c.height = Math.round(g.h * g.dpr);
      x = c.getContext('2d'); x.scale(g.dpr, g.dpr);
      drawTile(x, g.w, g.h, SEQ.charAt(i), fs);
      sprites.push(c);
    }
  }

  function centre(s, w) { s = s.substr(0, w); return new Array(Math.floor((w - s.length) / 2) + 1).join(' ') + s; }

  // text for each tile group, in the order of SEGS
  function boardData(f) {
    var T = ['', '', '', '', '', '', '', '', ''], d = { texts: T, iata: '', rt: null };
    if (!f) { T[4] = centre(String(status || 'No flights nearby').toUpperCase(), 22); return d; }
    var cs = (f.callsign || f.reg || f.hex || '?').toUpperCase();
    var rt = routes[cs]; if (!rt || !rt.codes) rt = null;
    var al = AIRLINES[cs.substr(0, 3)] || (rt && rt.airline && rt.airline.name ? [rt.airline.name, rt.airline.iata || ''] : null);
    var altT = f.alt === 'ground' ? 'ON GROUND' : (f.alt == null ? '---' : Math.round(f.alt) + ' FT');
    var spdT = f.gs == null ? '---' : Math.round(f.gs) + ' KT';
    var typeReg = [f.type, f.reg].filter(function (v) { return v; }).join(' ');
    T[0] = clean(al ? al[0] : cs).toUpperCase();
    T[1] = al ? cs : '';
    T[2] = clean(typeReg).toUpperCase();
    if (rt && rt.from && rt.to) {
      var cd = rt.codes.split('-');
      T[3] = cd[0] || ''; T[4] = clean(rt.from).toUpperCase();
      T[5] = cd[1] || ''; T[6] = clean(rt.to).toUpperCase();
      T[7] = 'ALT ' + altT.replace(' ', ''); T[8] = 'SPD ' + spdT.replace(' ', '');
    } else {
      T[3] = 'ALT'; T[4] = altT; T[5] = 'SPD'; T[6] = spdT; T[7] = f.dist.toFixed(1) + ' KM AWAY';
    }
    d.iata = al ? al[1] : ''; d.rt = rt;
    return d;
  }

  function setTexts(T, now) {
    var k, c, i, s, idx, r;
    for (k = 0; k < SEGS.length; k++) {
      r = SEGS[k][0]; s = String(T[k] || '');
      for (c = SEGS[k][1]; c <= SEGS[k][2]; c++) {
        idx = SEQ.indexOf(c - SEGS[k][1] < s.length ? s.charAt(c - SEGS[k][1]) : ' ');
        if (idx < 0) idx = SEQ.indexOf('?');
        i = r * COLS + c;
        if (cellTgt[i] !== idx) {
          cellTgt[i] = idx;
          if (cellCur[i] !== idx && cellStart[i] < 0) cellStart[i] = now + c * 14 + r * 40 + Math.random() * 100;
        }
        if (cellCur[i] === idx) cellStart[i] = -1;
      }
    }
  }

  function flapUpdate() {
    var d = boardData(flights.length ? flights[0] : null);
    board = d;
    setTexts(d.texts, performance.now());
    if (d.iata) getLogo(d.iata);
    startLoop();
  }
  function startLoop() { if (!rafId) rafId = requestAnimationFrame(frame); }
  function frame() {
    rafId = 0;
    var now = performance.now();
    if (flapBusy && now - lastFrame < 30) { rafId = requestAnimationFrame(frame); return; }
    lastFrame = now;
    flapBusy = drawFlap(now);
    if (flapBusy) rafId = requestAnimationFrame(frame);
  }

  /* ---------- live position and map ---------- */
  function trackNearest() {
    var f = flights[0];
    if (!f) { fix = null; return; }
    var k = (f.callsign || f.reg || f.hex || '?').toUpperCase();
    if (k !== trailKey) { trail = []; trailKey = k; }
    fix = { lat: f.lat, lon: f.lon, track: f.track, gs: f.gs, t: performance.now() };
    var last = trail[trail.length - 1];
    if (!last || last[0] !== f.lat || last[1] !== f.lon) { trail.push([f.lat, f.lon]); if (trail.length > 40) trail.shift(); }
  }
  // move the plane along its heading between data updates
  function planePos(now) {
    if (!fix) return null;
    if (typeof fix.track !== 'number' || !fix.gs) return { lat: fix.lat, lon: fix.lon };
    var dt = Math.min(40, Math.max(0, (now - fix.t) / 1000)), dk = fix.gs * 1.852 * dt / 3600, R = 6371, t = Math.PI / 180;
    var la = fix.lat * t, lo = fix.lon * t, b = fix.track * t, dr = dk / R;
    var la2 = Math.asin(Math.sin(la) * Math.cos(dr) + Math.cos(la) * Math.sin(dr) * Math.cos(b));
    var lo2 = lo + Math.atan2(Math.sin(b) * Math.sin(dr) * Math.cos(la), Math.cos(dr) - Math.sin(la) * Math.sin(la2));
    return { lat: la2 / t, lon: lo2 / t };
  }
  function near(lon, ref) { while (lon - ref > 180) lon -= 360; while (ref - lon > 180) lon += 360; return lon; }
  function wx(lon) { return (lon + 180) / 360; }
  function wy(lat) { lat = Math.max(-85, Math.min(85, lat)); var s = Math.sin(lat * Math.PI / 180); return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI); }

  function gcPoints(a, b, n) {
    var t = Math.PI / 180, la1 = a[0] * t, lo1 = a[1] * t, la2 = b[0] * t, lo2 = b[1] * t;
    var d = 2 * Math.asin(Math.sqrt(Math.pow(Math.sin((la2 - la1) / 2), 2) + Math.cos(la1) * Math.cos(la2) * Math.pow(Math.sin((lo2 - lo1) / 2), 2)));
    var out = [], i, f, A, B, x, y, z, lat, lon, prev = null;
    if (d < 1e-6) return [a, b];
    for (i = 0; i <= n; i++) {
      f = i / n; A = Math.sin((1 - f) * d) / Math.sin(d); B = Math.sin(f * d) / Math.sin(d);
      x = A * Math.cos(la1) * Math.cos(lo1) + B * Math.cos(la2) * Math.cos(lo2);
      y = A * Math.cos(la1) * Math.sin(lo1) + B * Math.cos(la2) * Math.sin(lo2);
      z = A * Math.sin(la1) + B * Math.sin(la2);
      lat = Math.atan2(z, Math.sqrt(x * x + y * y)) / t; lon = Math.atan2(y, x) / t;
      if (prev !== null) lon = near(lon, prev);
      prev = lon; out.push([lat, lon]);
    }
    return out;
  }

  function getTile(z, x, y) {
    var key = z + '/' + x + '/' + y, t = tileCache[key];
    if (t) return t.ok ? t.img : null;
    if (tileCount > 300) { tileCache = {}; tileCount = 0; }
    var img = new Image(); t = tileCache[key] = { img: img, ok: false }; tileCount++;
    img.onload = function () { t.ok = true; startLoop(); };
    img.onerror = function () {};
    img.src = 'https://tile.openstreetmap.org/' + key + '.png';
    return null;
  }

  function drawMap(X, Y, w, h, now) {
    var rt = board.rt, pp = planePos(now), pts = [], gc = null, i, k, d, best = 1e9;
    if (rt && rt.pts && pp) {
      if (!rt.gc) rt.gc = gcPoints(rt.pts[0], rt.pts[1], 48);
      gc = rt.gc; pts = gc.slice(); pts.push([pp.lat, near(pp.lon, gc[gc.length >> 1][1])]);
    } else {
      var dl = S.km / 111, dn = S.km / (111 * Math.max(0.2, Math.cos(S.lat * Math.PI / 180)));
      pts = [[S.lat + dl, S.lon - dn], [S.lat - dl, S.lon + dn]];
      if (pp) pts.push([pp.lat, near(pp.lon, S.lon)]);
    }
    var minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
    for (i = 0; i < pts.length; i++) {
      d = wx(pts[i][1]); if (d < minx) minx = d; if (d > maxx) maxx = d;
      d = wy(pts[i][0]); if (d < miny) miny = d; if (d > maxy) maxy = d;
    }
    var zf = Math.log(Math.min(w * 0.76 / (256 * Math.max(maxx - minx, 1e-6)), h * 0.7 / (256 * Math.max(maxy - miny, 1e-6)))) / Math.LN2;
    zf = Math.max(1, Math.min(12, zf));

    if (!best) return null;
    if (bestDet > Math.max(80, best.D * 0.12)) return null;           // plane is nowhere near this route
    var A2 = best.A, B2 = best.B;
    if (typeof f.track === 'number') {                                 // heading says it is flying the other way: swap
      var toB = angdiff(f.track, bearing(f.lat, f.lon, B2.lat, B2.lon));
      var toA = angdiff(f.track, bearing(f.lat, f.lon, A2.lat, A2.lon));
      if (toB > 110 && toA < 70) { var tmp = A2; A2 = B2; B2 = tmp; }
    }
    return {
      codes: (A2.iata || '?') + '-' + (B2.iata || '?'),
      from: tidy(A2.name), to: tidy(B2.name),
      pts: [[A2.lat, A2.lon], [B2.lat, B2.lon]]
    };
  }

  /* ---------- settings UI ---------- */
  function fill() {
    $('lat').value = S.lat; $('lon').value = S.lon; $('km').value = S.km; $('proxy').value = S.proxy || '';
    $('minAlt').value = S.minAlt; $('maxAlt').value = S.maxAlt;
    $('ground').checked = S.ground; $('demo').checked = S.demo;
  }
  function msg(t) { $('msg').textContent = t; }
  $('gear').onclick = function () {
    fill();
    var t = [];
    if (lastErr) t.push('Last error: ' + lastErr);
    if (flights.length) t.push('Nearest: ' + (flights[0].callsign || flights[0].reg || flights[0].hex));
    if (diag.route) t.push(diag.route);
    if (diag.logo) t.push(diag.logo);
    $('msg').innerHTML = '';
    t.forEach(function (x) { var d = document.createElement('div'); d.textContent = x; $('msg').appendChild(d); });
    $('panel').style.display = 'block';
  };
  $('close').onclick = function () { $('panel').style.display = 'none'; };
  $('save').onclick = function () {
    var lat = parseFloat($('lat').value), lon = parseFloat($('lon').value), km = parseFloat($('km').value);
    if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) { msg('Enter a valid latitude and longitude.'); return; }
    if (isNaN(km) || km < 1) { msg('Radius must be at least 1 km.'); return; }
    S.lat = lat; S.lon = lon; S.km = Math.min(460, km);
    S.proxy = $('proxy').value.replace(/^\s+|\s+$/g, '');
    if (S.proxy && S.proxy.indexOf('https://') !== 0) { msg('The relay address must start with https://'); return; }
    if (!S.proxy && !$('demo').checked) { msg('Add the relay address. Flight data needs it.'); return; }
    S.minAlt = parseFloat($('minAlt').value) || 0;
    S.maxAlt = parseFloat($('maxAlt').value) || 60000;
    S.ground = $('ground').checked; S.demo = $('demo').checked;
    S.v = 2;
    save(); flights = []; inRadius = []; logoImgs = {}; routes = {}; fix = null; trail = []; trailKey = ''; status = 'Loading...'; redraw(); poll();
    $('panel').style.display = 'none';
  };
  $('geo').onclick = function () {
    if (!navigator.geolocation) { msg('Location is not available in this browser. Type the coordinates instead.'); return; }
    msg('Finding location...');
    navigator.geolocation.getCurrentPosition(function (p) {
      $('lat').value = p.coords.latitude.toFixed(4); $('lon').value = p.coords.longitude.toFixed(4); msg('Location filled in. Press Save.');
    }, function () { msg('Could not get location. Type the coordinates instead.'); }, { timeout: 10000 });
  };
  $('full').onclick = function () {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) { try { fn.call(el); } catch (e) {} }
    $('panel').style.display = 'none';
  };

  /* ---------- run ---------- */
  function keepAwake() {
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) keepAwake(); });
  window.addEventListener('resize', redraw);

  status = S.demo ? '' : 'Loading...';
  keepAwake(); redraw(); poll();
  setInterval(poll, 10000);
  setInterval(startLoop, 1000);   // map keeps moving between updates
  try { if (document.fonts && document.fonts.load) document.fonts.load('700 40px "Roboto Condensed"').then(function () { spriteKey = ''; startLoop(); }); } catch (e) {}
  var first = true;
  try { first = !localStorage.getItem('flightboard'); } catch (e) {}
  if (first) { fill(); $('panel').style.display = 'block'; }
})();
</script>
</body>
</html>
